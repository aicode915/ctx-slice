name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'ctx-slice/package-lock.json'
      - name: Install dependencies
        working-directory: ./ctx-slice
        run: npm ci
      - name: Build TypeScript
        working-directory: ./ctx-slice
        run: npm run build
      - name: Run Tests
        working-directory: ./ctx-slice
        run: npm test
